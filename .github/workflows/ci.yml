name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Lint
        run: ruff check src scripts tests

      - name: Tests
        run: pytest -q

      - name: Results are consistent with the committed data
        # Re-derives the site payload from results/ and fails if it drifts. Cheap guard
        # against results and page disagreeing after a partial rerun.
        run: |
          python -m scripts.build_site
          git diff --exit-code -- docs/data/report.json
